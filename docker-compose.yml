version: "1.0"

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - VERSION=public
      - PLEX_CLAIM=claim-94sC-hcCbJ_kcKHiSdSd
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:plex
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/plex/_data:/config
      - ${SSD}/media4k:/media4k
      - ${HDD}/media:/media
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:prowlarr
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/prowlarr/_data:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:develop
    container_name: sonarr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sonarr
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/sonarr/_data:/config
      - ${HDD}:/data
      - ${HDD}/media/tv:/tv
      - ${SSD}:/data4k
    ports:
      - 8989:8989
    restart: unless-stopped
  sonarr4k:
    image: lscr.io/linuxserver/sonarr:develop
    container_name: sonarr4k
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sonarr
      - TP_THEME=${TP_THEME}
      - TP_ADDON=sonarr-4k-logo
    volumes:
      - ${DOCKER}/sonarr4k/_data:/config
      - ${SSD}:/data4k
      - ${SSD}/media4k/tv4k:/tv
    ports:
      - 8990:8989
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:develop
    container_name: radarr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:radarr
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/radarr/_data:/config
      - ${HDD}:/data
      - ${HDD}/media/movies:/movies
      - ${SSD}:/data4k
    ports:
      - 7878:7878
    restart: unless-stopped
  radarr4k:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr4k
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:radarr
      - TP_THEME=${TP_THEME}
      - TP_ADDON=radarr-4k-logo
    volumes:
      - ${DOCKER}/radarr4k/_data:/config
      - ${SSD}:/data4k
      - ${SSD}/media4k/movies4k:/movies
    ports:
      - 7879:7878
    restart: unless-stopped
#  lidarr:
#    image: lscr.io/linuxserver/lidarr:develop
#    container_name: lidarr
#    environment:
#      - PUID=1027
#      - PGID=100
#      - TZ=Etc/UTC
#      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:lidarr
