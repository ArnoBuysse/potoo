  overseerr:
    image: lscr.io/linuxserver/overseerr:develop
    container_name: overseerr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:overseerr
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/overseerr/_data:/config
    ports:
      - 5055:5055
    restart: unless-stopped
  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER}/homarr/_data:/app/data/configs
      - ${DOCKER}/homarr/icons:/app/public/icons
      - ${DOCKER}/homarr/data:/data
    ports:
      - '7575:7575'
  notifiarr:
    container_name: notifiarr
    hostname: notifiarr
    image: golift/notifiarr
    restart: unless-stopped
    ports:
      - "5454:5454"
    volumes:
      - ${DOCKER}/notifiarr/_data:/config
      - ${DOCKER}/notifiarr/utmp:/var/run/utmp
      - ${DOCKER}/notifiarr/machine-id:/etc/machine-id
  dash:
    container_name: dash
    image: mauricenino/dashdot:latest
    restart: unless-stopped
    privileged: true
    ports:
      - '3001:3001'
    volumes:
      - /:/mnt/host:ro
    environment:
      DASHDOT_SHOW_HOST: 'true'
      DASHDOT_SHOW_DASH_VERSION: 'bottom_right'
      DASHDOT_ACCEPT_OOKLA_EULA: 'true'
    stdin_open: true  # Equivalent to -i in docker run
    tty: true         # Equivalent to -t in docker run
  bazarr:
    image: lscr.io/linuxserver/bazarr:development
    container_name: bazarr
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - ${DOCKER}/bazarr/_data:/config
      - ${HDD}:/data
      - ${SSD}:/data4k
    ports:
      - 6767:6767
    restart: unless-stopped
