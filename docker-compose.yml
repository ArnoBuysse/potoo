  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sabnzbd
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/sabnzbd/_data:/config
      - ${HDD}/usenet:/data/usenet/
      - ${SSD}/usenet4k:/data4k/usenet4k/
    ports:
      - 8081:8080
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1027
      - PGID=100
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - TP_THEME=${TP_THEME}
    volumes:
      - ${DOCKER}/qbittorrent/_data:/config
      - ${HDD}/torrents:/data/torrents/
      - ${SSD}/torrents4k:/data4k/torrents4k/
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
